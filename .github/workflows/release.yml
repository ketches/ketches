name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/ketches-api
  UI_IMAGE: ghcr.io/${{ github.repository_owner }}/ketches-ui

jobs:
  # ── Tests must pass before releasing ───────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GCC (required for CGO/SQLite)
        run: sudo apt-get install -y gcc

      - name: Run tests
        run: go test -race ./...

  # ── Build and push backend image ───────────────────────────────────────────
  release-api:
    name: Release API image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            TAG=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build and push frontend image ──────────────────────────────────────────
  release-ui:
    name: Release UI image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UI_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-helm-chart:
    name: Release Helm chart
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    env:
      CHART_DIR: deploy/helm/ketches
      CHART_REPO_DIR: .chartrepo
      CHART_REPO_URL: https://ketches.github.io/ketches
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate chart
        run: helm lint "${CHART_DIR}"

      - name: Package chart from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          CHART_VERSION="${TAG_NAME#v}"
          mkdir -p dist
          helm package "${CHART_DIR}" \
            --destination dist \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}"

      - name: Prepare gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            git worktree add "${CHART_REPO_DIR}" gh-pages
          else
            git worktree add -b gh-pages "${CHART_REPO_DIR}"
          fi

      - name: Update chart repository index
        run: |
          cp dist/*.tgz "${CHART_REPO_DIR}/"
          if [ -f "${CHART_REPO_DIR}/index.yaml" ]; then
            helm repo index "${CHART_REPO_DIR}" --url "${CHART_REPO_URL}" --merge "${CHART_REPO_DIR}/index.yaml"
          else
            helm repo index "${CHART_REPO_DIR}" --url "${CHART_REPO_URL}"
          fi

      - name: Commit and push gh-pages
        run: |
          cd "${CHART_REPO_DIR}"
          git add .
          if git diff --cached --quiet; then
            echo "No chart changes to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(charts): publish ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages

  # ── Create GitHub Release ──────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [release-api, release-ui, release-helm-chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Pre-release when tag contains a pre-release identifier (e.g. v1.0.0-beta.1)
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Docker Images

            | Image | Pull command |
            |-------|-------------|
            | API   | `docker pull ${{ env.API_IMAGE }}:${{ github.ref_name }}` |
            | UI    | `docker pull ${{ env.UI_IMAGE }}:${{ github.ref_name }}` |

            ## Quick Start

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/deploy/docker/docker-compose.yml \
              -o docker-compose.yml
            docker compose up -d
            ```
