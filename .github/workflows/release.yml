name: Release

on:
  push:
    tags:
      - "v*"

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE || 'ketches' }}
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'ketches' }}
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE || 'ketches' }}
  API_IMAGE_NAME: ketches-api
  UI_IMAGE_NAME: ketches-ui

jobs:
  # ── Lint must pass before releasing ───────────────────────────────────────
  lint-backend:
    name: Lint (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ./...

  # ── Frontend must build before releasing ─────────────────────────────────
  build-frontend:
    name: Lint and Build (Node.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  # ── Tests must pass before releasing ───────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GCC (required for CGO/SQLite)
        run: sudo apt-get install -y gcc

      - name: Run tests
        run: go test -race ./...

  # ── Build and push backend image ───────────────────────────────────────────
  release-api:
    name: Release API image
    runs-on: ubuntu-latest
    needs: [lint-backend, test, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Aliyun container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.API_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.API_IMAGE_NAME }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            TAG=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build and push frontend image ──────────────────────────────────────────
  release-ui:
    name: Release UI image
    runs-on: ubuntu-latest
    needs: [lint-backend, test, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Aliyun container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ env.UI_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.UI_IMAGE_NAME }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.UI_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-helm-chart:
    name: Release Helm chart
    runs-on: ubuntu-latest
    needs: [lint-backend, test, build-frontend]
    permissions:
      contents: write
    env:
      CHART_DIR: deploy/helm/ketches
      CHART_REPO_DIR: .chartrepo
      CHART_REPO_URL: https://ketches.github.io/ketches
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate chart
        run: helm lint "${CHART_DIR}"

      - name: Package chart from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          CHART_VERSION="${TAG_NAME#v}"
          mkdir -p dist
          helm package "${CHART_DIR}" \
            --destination dist \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}"

      - name: Prepare gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            git worktree add "${CHART_REPO_DIR}" gh-pages
          else
            git worktree add -b gh-pages "${CHART_REPO_DIR}"
          fi

      - name: Update chart repository index
        run: |
          cp dist/*.tgz "${CHART_REPO_DIR}/"
          if [ -f "${CHART_REPO_DIR}/index.yaml" ]; then
            helm repo index "${CHART_REPO_DIR}" --url "${CHART_REPO_URL}" --merge "${CHART_REPO_DIR}/index.yaml"
          else
            helm repo index "${CHART_REPO_DIR}" --url "${CHART_REPO_URL}"
          fi

      - name: Commit and push gh-pages
        run: |
          cd "${CHART_REPO_DIR}"
          git add .
          if git diff --cached --quiet; then
            echo "No chart changes to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(charts): publish ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages

  # ── Create GitHub Release ──────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [release-api, release-ui, release-helm-chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header --verbose
        env:
          OUTPUT: RELEASE_CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release notes
        id: release-vars
        run: |
          version="${GITHUB_REF_NAME#v}"

          {
            echo '## Docker Images'
            echo
            echo '| Image | Pull command |'
            echo '|-------|-------------|'
            printf '| API (GHCR) | `docker pull %s/%s/%s:%s` |\n' "${GHCR_REGISTRY}" "${GHCR_NAMESPACE}" "${API_IMAGE_NAME}" "${version}"
            printf '| API (Docker Hub) | `docker pull %s/%s/%s:%s` |\n' "${DOCKERHUB_REGISTRY}" "${DOCKERHUB_NAMESPACE}" "${API_IMAGE_NAME}" "${version}"
            printf '| API (Aliyun) | `docker pull %s/%s/%s:%s` |\n' "${ALIYUN_REGISTRY}" "${ALIYUN_NAMESPACE}" "${API_IMAGE_NAME}" "${version}"
            printf '| UI (GHCR) | `docker pull %s/%s/%s:%s` |\n' "${GHCR_REGISTRY}" "${GHCR_NAMESPACE}" "${UI_IMAGE_NAME}" "${version}"
            printf '| UI (Docker Hub) | `docker pull %s/%s/%s:%s` |\n' "${DOCKERHUB_REGISTRY}" "${DOCKERHUB_NAMESPACE}" "${UI_IMAGE_NAME}" "${version}"
            printf '| UI (Aliyun) | `docker pull %s/%s/%s:%s` |\n' "${ALIYUN_REGISTRY}" "${ALIYUN_NAMESPACE}" "${UI_IMAGE_NAME}" "${version}"

            echo
            echo '## Quick Start'
            echo
            echo '```bash'
            printf 'curl -fsSL https://raw.githubusercontent.com/%s/master/deploy/docker/docker-compose.yml \\\n' "${GITHUB_REPOSITORY}"
            echo '  -o docker-compose.yml'
            echo 'docker compose up -d'
            echo '```'

            echo
            if [ -s RELEASE_CHANGELOG.md ]; then
              cat RELEASE_CHANGELOG.md
            else
              echo '## Changes'
              echo
              echo 'No changelog entries were generated for this release.'
            fi
          } > release-notes.md

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          # Pre-release when tag contains a pre-release identifier (e.g. v1.0.0-beta.1)
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: RELEASE_CHANGELOG.md
