services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ketches
      POSTGRES_USER: ketches
      POSTGRES_PASSWORD: ketches
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ketches"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: info
      DB_DRIVER: postgres
      DB_SOURCE: host=postgres port=5432 user=ketches password=ketches dbname=ketches sslmode=disable
      JWT_SECRET: change-this-in-production
      CORS_ALLOWED_ORIGINS: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      # Points to the api service; change to an external URL if api is not co-located
      BACKEND_URL: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
