services:
  ketches-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ketches
      POSTGRES_USER: ketches
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ketches"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ketches-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: info
      DB_DRIVER: postgres
      DB_SOURCE: host=ketches-db port=5432 user=ketches password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD} dbname=ketches sslmode=${DB_SSLMODE:-require}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      BUILD_LOG_BASE_DIR: /app/data/build-logs
      BUILD_LOG_RETENTION_DAYS: 15
    volumes:
      - build-log-data:/app/data/build-logs
    depends_on:
      ketches-db:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      # Points to the api service; change to an external URL if api is not co-located
      BACKEND_URL: http://ketches-api:8080
    depends_on:
      - ketches-api
    restart: unless-stopped

volumes:
  postgres-data:
  build-log-data:
