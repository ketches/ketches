apiVersion: v1
kind: Namespace
metadata:
  name: ketches
---
apiVersion: v1
kind: Secret
metadata:
  name: ketches-secrets
  namespace: ketches
type: Opaque
stringData:
  db-password: ketches-quickstart-postgres
  jwt-secret: ketches-quickstart-jwt-secret
  secret-encryption-key: ketches-quickstart-encryption-key
  bootstrap-admin-username: ""
  bootstrap-admin-password: ""
  smtp-password: ""
---
apiVersion: v1
kind: Service
metadata:
  name: ketches-db
  namespace: ketches
spec:
  ports:
    - port: 5432
  selector:
    app: ketches-db
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ketches-db
  namespace: ketches
spec:
  serviceName: "ketches-db"
  replicas: 1
  selector:
    matchLabels:
      app: ketches-db
  template:
    metadata:
      labels:
        app: ketches-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ketches"
            - name: POSTGRES_USER
              value: "ketches"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ketches-secrets
                  key: db-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              memory: "2Gi"
              cpu: "1"
            requests:
              memory: "256Mi"
              cpu: "250m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ketches-api
  namespace: ketches
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: ketches-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ketches-api
  namespace: ketches
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ketches-api
  template:
    metadata:
      labels:
        app: ketches-api
    spec:
      containers:
        - name: ketches-api
          image: ghcr.io/ketches/ketches/ketches-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: DB_DRIVER
              value: "postgres"
            - name: DB_AUTO_MIGRATE
              value: "true"
            - name: DB_HOST
              value: "ketches-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ketches"
            - name: DB_USERNAME
              value: "ketches"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ketches-secrets
                  key: db-password
            - name: DB_SSLMODE
              value: "disable"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ketches-secrets
                  key: jwt-secret
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ketches-secrets
                  key: secret-encryption-key
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ketches-secrets
                  key: bootstrap-admin-username
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ketches-secrets
                  key: bootstrap-admin-password
            - name: SIGN_UP_EMAIL_VERIFICATION_REQUIRED
              value: "false"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              value: ""
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ketches-secrets
                  key: smtp-password
            - name: SMTP_FROM
              value: ""
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:30080,http://127.0.0.1:30080"
          resources:
            limits:
              memory: "2Gi"
              cpu: "1"
            requests:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: ketches-ui
  namespace: ketches
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
      name: http
  selector:
    app: ketches-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ketches-ui
  namespace: ketches
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ketches-ui
  template:
    metadata:
      labels:
        app: ketches-ui
    spec:
      containers:
        - name: ketches-ui
          image: ghcr.io/ketches/ketches/ketches-ui:latest
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://ketches-api:8080"
          resources:
            limits:
              memory: "1Gi"
              cpu: "1"
            requests:
              memory: "128Mi"
              cpu: "250m"
